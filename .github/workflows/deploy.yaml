name: Deploy WiWO-ADs

# Despliegue automatico a produccion (ads.wiwo.me):
#  - al integrar (merge) un PR a main
#  - o a mano desde la pestana Actions (Run workflow), que despliega el main actual
on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:

# Un deploy a la vez; si llega otro mientras corre, espera (no se cancela a medias).
concurrency:
  group: deploy-wiwo-ads-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: server.wiwo.center
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 12m
          script: |
            set -e
            cd /root/wiwo-ads
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            npm ci
            # Respaldo consistente de la base ANTES de migrar (conserva los ultimos 20)
            WIWO_DB_PATH=/var/lib/wiwo-ads/wiwo.sqlite node servidor/respaldar.mjs
            NODE_OPTIONS='--import /root/wiwo-ads/servidor/registrar.mjs' npx vinext build
            WIWO_DB_PATH=/var/lib/wiwo-ads/wiwo.sqlite node servidor/migrar.mjs
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save
            # Verificacion: si la app no responde tras el reinicio, el workflow sale en rojo
            for i in 1 2 3 4 5 6; do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://127.0.0.1:3031/acceso || true)
              echo "health /acceso intento $i: $CODE"
              [ "$CODE" = "200" ] && exit 0
              sleep 5
            done
            echo "La app no respondio 200 tras el deploy" >&2
            exit 1
