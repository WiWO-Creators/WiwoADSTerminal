name: Deploy WiWO-ADs

on:
  pull_request:
    branches:
      - main
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: server.wiwo.center
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /root/wiwo-ads
            git fetch origin
            git checkout main
            git pull origin main
            npm ci
            NODE_OPTIONS='--import /root/wiwo-ads/servidor/registrar.mjs' npx vinext build
            WIWO_DB_PATH=/var/lib/wiwo-ads/wiwo.sqlite node servidor/migrar.mjs
            pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
            pm2 save